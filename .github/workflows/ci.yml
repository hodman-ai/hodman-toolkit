name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:skill
      - run: npm audit --audit-level=moderate
      - run: npm pack --workspace @hodman-ai/cli --dry-run --json > /dev/null
      - run: npm pack --workspace @hodman-ai/api-client --dry-run --json > /dev/null
      - run: npm pack --workspace @hodman-ai/api-contract --dry-run --json > /dev/null
